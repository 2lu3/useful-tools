[general]
# 並列処理のワーカー数
max_workers = 5

[file_extensions]
# 画像ファイルの拡張子
image = ["*.jpg", "*.jpeg", "*.png", "*.gif", "*.bmp", "*.webp"]
# テキストファイルの拡張子
text = ["*.txt", "*.md"]
# CSVファイルの拡張子   
csv = ["*.csv"]

[llm]
# OpenAIを使用するかどうか（falseの場合はLM Studioなど）
use_openai = true
# 使用するモデル（画像・テキスト共通）
#model = "o3-pro-2025-06-10"
model = "o3"
# 推論の努力レベル
reasoning_effort = "medium"
# LM StudioなどのエンドポイントURL（use_openai = falseの場合に使用）
endpoint_url = "http://localhost:1234/v1"

[prompt]

remove_combination_choices = "prompt/remove_combination_choices.txt"
format_for_anki = "prompt/format_for_anki.txt"
image_to_text = "prompt/image_to_text.txt"